# Spring Boot application properties

server.port=8080
spring.application.name=backend
python.api.url=http://localhost:8000

# Configuration PostgreSQL
# spring.datasource.url=jdbc:postgresql://localhost:5433/test_wateranalysis
spring.datasource.url=jdbc:postgresql://localhost:5432/wateranalysis
spring.datasource.username=pierre
spring.datasource.password=Xbanadz_8_dbGis
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration Hibernate (pour Spring Data JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.search.backend.lucene.analysis.configurer=com.example.backend.config.analysis.CustomAnalyser
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration Springdoc/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.validator-url=false

# Pour inclure tous les endpoints (optionnel)
springdoc.packages-to-scan=com.example.backend.presentation.controller
springdoc.paths-to-match=/api/**

# Activer la génération automatique (défaut true)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# DEBUG tools
logging.level.org.springframework=DEBUG
logging.level.com.example.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springdoc=DEBUG
logging.level.io.swagger=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#ERROR configuration
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# Activer les logs détaillés (développement)
logging.level.com.example.backend=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG